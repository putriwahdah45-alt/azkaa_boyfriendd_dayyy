<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Azkaa 🤍</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffe6ef, #fff7fb);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #5c3945;
    }

    .card {
      width: 90%;
      max-width: 430px;
      background: rgba(255,255,255,0.9);
      padding: 30px 22px;
      border-radius: 28px;
      box-shadow: 0 10px 30px rgba(150,80,100,0.18);
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    p {
      font-size: 17px;
      line-height: 1.7;
    }

    button {
      border: none;
      padding: 14px 24px;
      border-radius: 25px;
      background: #e98ba8;
      color: white;
      font-size: 16px;
      margin-top: 15px;
      cursor: pointer;
    }

    #surprise {
      display: none;
      margin-top: 25px;
    }

    .heart {
      font-size: 55px;
      animation: beat 1s infinite;
    }

    @keyframes beat {
      50% {
        transform: scale(1.15);
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="heart">🤍</div>

    <h1>For Azkaa</h1>

    <p>
      ada little surprise for youu...
      <br>
      jangan senyum dulu yaa 🤭
    </p>

    <button onclick="openSurprise()">
      buka surprise 💌
    </button>

    <div id="surprise">

      <h2>Happy Boyfriend Day, Azkaa 🤍</h2>

      <p>
        makasih yaa udah hadir di hidup aku.
        <br><br>
        semoga kita selalu bisa saling nemenin,
        saling ngerti, dan bikin banyak kenangan
        bareng-bareng.
        <br><br>
        i love youu 🤍
      </p>

      <p>
        — dari Putrii ♡
      </p>

    </div>

  </div>

  <script>
    function openSurprise() {
      document.getElementById("surprise").style.display = "block";
    }
  </script>

</body>
</html>
